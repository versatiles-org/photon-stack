# Drop-in replacement for /etc/nginx/sites/geocode.versatiles.org
#
# Changes vs the current file, all of them fixing something measured:
#   1. upstream host is 127.0.0.1, not `localhost`. `localhost` resolved to both
#      ::1 and 127.0.0.1, but Photon binds IPv4 only -> 278 x
#      "connect() failed (111: Connection refused)" in error.log today, each
#      costing a wasted round trip and intermittently marking the peer down.
#   2. keepalive to the upstream: was a fresh TCP connection per request.
#   3. proxy_cache: repeated queries were hitting the disk-bound index every
#      time. Photon's own query cache hit rate was 16% (21M/130M).
#   4. access_log back on, with $request_time and cache status, so this is
#      measurable next time instead of reconstructed from counters.
#   5. explicit timeouts.
#
# proxy_cache_path must live in http{} context — this file is included from
# there (that is why the existing upstream{} block works at this level).

proxy_cache_path /var/cache/nginx/photon
                 levels=1:2
                 keys_zone=photon_cache:20m
                 max_size=4g
                 inactive=7d
                 use_temp_path=off;

log_format photon_fmt '$remote_addr - [$time_local] "$request" '
                      '$status $body_bytes_sent '
                      'rt=$request_time urt=$upstream_response_time '
                      'cache=$upstream_cache_status';

upstream photon {
	# Port 2323 = the containerised Photon 1.x.
	# The old 0.6.2 service stays on 2322 until it is decommissioned,
	# which makes rollback a one-line change here.
	server 127.0.0.1:2323 max_fails=3 fail_timeout=10s;
	keepalive 32;
	keepalive_timeout 60s;
}

server {

	listen [::]:443 ssl http2;
	listen 443 ssl http2;

	listen 80;
	listen [::]:80;

	server_name geocode.versatiles.org;

	ssl_certificate /etc/letsencrypt/live/geocode.versatiles.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/geocode.versatiles.org/privkey.pem;
	ssl_trusted_certificate /etc/letsencrypt/live/geocode.versatiles.org/fullchain.pem;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers on;
	ssl_dhparam /etc/dhparam.pem;
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
	ssl_ecdh_curve secp384r1;
	ssl_session_timeout 10m;
	ssl_session_cache shared:SSL:10m;
	ssl_session_tickets off;
#	ssl_stapling on;
#	ssl_stapling_verify on;
#	resolver 9.9.9.9 1.1.1.1;
#	resolver_timeout 5s;

	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
	add_header X-Content-Type-Options nosniff;
	add_header X-XSS-Protection "1; mode=block";
	# HIT / MISS / STALE / UPDATING — useful for verifying the cache works.
	add_header X-Cache-Status $upstream_cache_status;

	keepalive_timeout 30;
	autoindex off;

	charset utf-8;

	# Was `off`. Latency is invisible without this.
	access_log /var/log/nginx/photon.access.log photon_fmt;
	log_not_found off;

	etag on;

	location = / {
		return 204; # FIXME add index site
	}

	location / {
		proxy_pass http://photon;

		# Required for upstream keepalive to actually be used.
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_connect_timeout 2s;
		proxy_send_timeout 15s;
		# Photon's own -query-timeout is 5s; this is the outer bound.
		proxy_read_timeout 15s;

		proxy_cache photon_cache;
		proxy_cache_methods GET HEAD;
		# Geocoding results only change when the index is rebuilt (weekly at most).
		proxy_cache_valid 200 6h;
		proxy_cache_valid 400 404 1m;
		# Photon sends no cache headers; make caching deterministic.
		proxy_ignore_headers Cache-Control Expires Set-Cookie;
		# Collapse concurrent identical misses into one upstream request.
		# Matters a lot when a cold query costs hundreds of ms.
		proxy_cache_lock on;
		proxy_cache_lock_timeout 10s;
		proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
		proxy_cache_background_update on;
		# Escape hatch for benchmarking: send `X-No-Cache: 1`.
		proxy_cache_bypass $http_x_no_cache;
	}

	location /.well-known/acme-challenge {
		root /var/www;
	}

}
