# The nginx settings that are not about geocode.versatiles.org itself. The
# server is in templates/geocode.conf.template.

worker_processes auto;
worker_rlimit_nofile 65536;

# How long a stopping worker (container stop, or the old workers after a
# reload) waits for its open connections. Without a limit, one idle keepalive
# connection holds the shutdown until Docker kills the container, and nothing
# listens on 80/443 meanwhile. Requests here take milliseconds.
worker_shutdown_timeout 1s;

pid /run/nginx.pid;

# Only critical errors, to the container log. nginx's error lines carry the
# full client address and request line, which for a geocoder is the search
# text. The access log (anonymised, no query string) and Photon's own log show
# what goes wrong: an upstream failure is a 502 with `urt=-` there.
error_log /dev/stderr crit;

events {
   worker_connections 2048;
   multi_accept on;
}

http {
   server_tokens off;

   sendfile on;
   tcp_nopush on;
   tcp_nodelay on;
   keepalive_timeout 30;

   types_hash_max_size 2048;

   include /etc/nginx/mime.types;
   default_type application/octet-stream;

   # IP anonymisation, as on tiles.versatiles.org: the last octet of an IPv4
   # address is zeroed; an IPv6 address is cut to its first two groups (the
   # first 32 of its 128 bits).
   map $remote_addr $remote_addr_anon {
      ~(?P<ip>\d+\.\d+\.\d+)\.    $ip.0;
      ~(?P<ip>[^:]+:[^:]+):       $ip::;
      default                     0.0.0.0;
   }

   # Per client address. A safety net, not a usage policy: typing into the
   # search box sends a request per keystroke, and the busiest client measured
   # (a batch job, November 2026) sent 250 requests a minute, about 4 a second,
   # which still passes. Needs the real client address, which Docker passes on
   # for IPv6 only because the compose network has IPv6 (see docker-compose.yml).
   limit_req_zone $binary_remote_addr zone=clients:10m rate=5r/s;
   limit_req_status 429;

   access_log off;

   include /etc/nginx/conf.d/*.conf;
}
