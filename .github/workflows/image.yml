name: Image

# Builds the Photon image, tests it on amd64 and arm64 against a real index
# (tests/smoke.sh), and on main publishes it to ghcr.io/versatiles-org/photon.
#
# Tags: the Photon version (e.g. `1.2.1`, what docker-compose.yml runs), `latest`,
# and `sha-<commit>`. A rebuild of the same Photon version (a new base image,
# say) moves the version tag; the sha tag of the build before stays, so going
# back is a matter of naming that tag in PHOTON_VERSION.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/versatiles-org/photon

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - name: shellcheck
        run: shellcheck entrypoint.sh bench.sh tests/*.sh bin/*/*.sh

  test:
    name: Test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          # Native arm64, the platform of geocode.versatiles.org (Hetzner CAX).
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: docker build -t photon-test .

      - name: Smoke test
        run: tests/smoke.sh photon-test

  publish:
    name: Publish
    needs: [lint, test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the Photon version
        run: |
          VERSION=$(sed -n 's/^ARG PHOTON_VERSION=//p' Dockerfile)
          if [ -z "$VERSION" ]; then
            echo "::error::No 'ARG PHOTON_VERSION=' line in the Dockerfile."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Photon $VERSION"

      # The image has no RUN step that does real work (a mkdir and a chmod), so
      # building arm64 under QEMU costs seconds. The test job above ran it natively.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
