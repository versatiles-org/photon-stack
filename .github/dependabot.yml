version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-github-actions:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"

  # The base image of the Dockerfile (eclipse-temurin), pinned by digest: a new
  # Temurin or Ubuntu build moves the digest, and Dependabot proposes it. The
  # Photon jar is not a Docker image, so this cannot see it;
  # .github/workflows/photon-release.yml watches for new Photon releases.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  # The nginx and certbot images in docker-compose.yml. Photon's own image is
  # named there by a variable (PHOTON_VERSION), which Dependabot leaves alone.
  # Not grouped: each image gets a pull request of its own that can be tested
  # and merged independently (nginx bumps run tests/nginx-config.sh).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
