version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-github-actions:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"

  # The base image of the Dockerfile (eclipse-temurin), pinned by digest: a new
  # Temurin or Ubuntu build moves the digest, and Dependabot proposes it. The
  # Photon jar is not a Docker image, so this cannot see it;
  # .github/workflows/photon-release.yml watches for new Photon releases.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
