services:
  photon:
    build:
      context: .
      args:
        PHOTON_VERSION: "${PHOTON_VERSION}"
        PHOTON_UID: "${PHOTON_UID}"
        PHOTON_GID: "${PHOTON_GID}"
    image: "photon-local:${PHOTON_VERSION}"
    container_name: photon
    restart: unless-stopped

    # ---------------------------------------------------------------------
    # DO NOT ADD `mem_limit` / `deploy.resources.limits.memory` HERE.
    #
    # This host runs cgroup v2. Page cache for the mmapped Lucene index is
    # charged to the container's cgroup. Photon's entire performance profile
    # is "how much of the index is in page cache" — a memory limit tells the
    # kernel to reclaim exactly the pages this service depends on. An
    # unlimited container lets the index compete for host RAM normally.
    # ---------------------------------------------------------------------

    environment:
      JAVA_OPTS: >-
        -Xms${JAVA_HEAP_MIN}
        -Xmx${JAVA_HEAP_MAX}
        -XX:+UseG1GC
        -XX:+ExitOnOutOfMemoryError
        -Djava.io.tmpdir=/photon/tmp
        -Dfile.encoding=UTF-8
      # -listen-ip 0.0.0.0 is safe: the published port below is bound to
      # 127.0.0.1 on the host, so nothing is reachable from outside.
      # -query-timeout caps pathological queries (`q=b` cost 6.3s on 0.6.2).
      PHOTON_ARGS: >-
        -data-dir /photon/data
        -listen-ip 0.0.0.0
        -listen-port 2322
        -cors-any
        -query-timeout 5
        -max-results 20
        -default-language en
      PHOTON_DATA_DIR: "${PHOTON_DATA_DIR}"

    volumes:
      # Bind-mount, NOT a named volume: keeps the index on the raw local
      # filesystem instead of the overlay2 graph driver.
      - "${PHOTON_DATA_DIR}:/photon/data"
      - photon-tmp:/photon/tmp

    ports:
      - "127.0.0.1:${PHOTON_HOST_PORT}:2322"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:2322/api?q=berlin&limit=1' >/dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      # Cold-starting OpenSearch over a ~100 GB index takes minutes.
      start_period: 300s

    # The old setup produced a 392 MB unrotated photon.log. json-file would
    # reproduce that faithfully without these caps.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

    ulimits:
      memlock: -1
      nofile:
        soft: 65536
        hard: 65536

volumes:
  photon-tmp:
