services:
  photon:
    # Built and published by .github/workflows/image.yml. To try a local build
    # instead: `docker build -t ghcr.io/versatiles-org/photon:<version> .`
    image: "ghcr.io/versatiles-org/photon:${PHOTON_VERSION}"
    container_name: photon
    restart: unless-stopped
    # Must match the owner of the bind-mounted index directory on the host.
    user: "${PHOTON_UID}:${PHOTON_GID}"

    # ---------------------------------------------------------------------
    # DO NOT ADD `mem_limit` / `deploy.resources.limits.memory` HERE.
    #
    # This host runs cgroup v2. Page cache for the mmapped Lucene index is
    # charged to the container's cgroup. Photon's entire performance profile
    # is "how much of the index is in page cache" — a memory limit tells the
    # kernel to reclaim exactly the pages this service depends on. An
    # unlimited container lets the index compete for host RAM normally.
    # ---------------------------------------------------------------------

    environment:
      # Added to the image's JAVA_OPTS by the JVM itself.
      JAVA_TOOL_OPTIONS: "-Xms${JAVA_HEAP_MIN} -Xmx${JAVA_HEAP_MAX}"
      PHOTON_DATA_DIR: "${PHOTON_DATA_DIR}"

    # Appended to the image's PHOTON_ARGS (data dir, listen address and port).
    # -query-timeout caps pathological queries (`q=b` cost 6.3s on 0.6.2).
    command:
      - -cors-any
      - -query-timeout
      - "5"
      - -max-results
      - "20"
      - -default-language
      - en

    volumes:
      # Bind-mount, NOT a named volume: keeps the index on the raw local
      # filesystem instead of the overlay2 graph driver.
      - "${PHOTON_DATA_DIR}:/photon/data"
      - photon-tmp:/photon/tmp

    # The image listens on 0.0.0.0 inside the container; this binds it to
    # loopback on the host, so nothing is reachable from outside.
    ports:
      - "127.0.0.1:${PHOTON_HOST_PORT}:2322"

    # The healthcheck is the image's (Dockerfile: HEALTHCHECK on /status).

    # The old setup produced a 392 MB unrotated photon.log. json-file would
    # reproduce that faithfully without these caps.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

    ulimits:
      memlock: -1
      nofile:
        soft: 65536
        hard: 65536

volumes:
  photon-tmp:
